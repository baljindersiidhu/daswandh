spring.application.name=backend

# Allowed frontend origins for CORS
app.cors.allowed-origins=http://localhost:5173
# Defaults are fine for URL/username (not secret). Password has NO default on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/daswandh}
spring.datasource.username=${DB_USER:daswandh_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate only checks tables; Flyway creates them
spring.jpa.hibernate.ddl-auto=validate
# Avoids lazy-loading surprises in controllers
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8080

# Comma-separated list works for multiple origins
# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Admin account configuration
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}