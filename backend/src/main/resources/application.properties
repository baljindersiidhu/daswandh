spring.application.name=backend

# Allowed frontend origins for CORS
app.cors.allowed-origins=http://localhost:5173
# Defaults are fine for URL/username (not secret). Password has NO default on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/daswandh}
spring.datasource.username=${DB_USER:daswandh_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate only checks tables; Flyway creates them
spring.jpa.hibernate.ddl-auto=validate
# Avoids lazy-loading surprises in controllers
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8080

# Comma-separated list works for multiple origins
# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Admin account configuration
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Razorpay: TEST mode only. The app refuses to start with any key that isn't rzp_test_...
app.razorpay.key-id=${RAZORPAY_KEY_ID}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
app.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}

# The secret you will type into Razorpay's webhook settings (NOT the API key secret)
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# Cloudinary (proof images). The secret stays on the server and is never sent to the browser.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.folder=${CLOUDINARY_FOLDER:daswandh/proofs}
app.cloudinary.base-url=${CLOUDINARY_BASE_URL:https://api.cloudinary.com/v1_1}